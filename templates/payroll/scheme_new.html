{% extends "base.html" %}
{% block title %}Новая схема ЗП{% endblock %}

{% block content %}
  <div class="page-head">
    <div>
      <a class="back" href="{% url 'payroll_schemes' %}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>Назад</a>
      <h1 class="display" style="margin:0;">Новая схема</h1>
    </div>
  </div>

  <div class="card" style="max-width:520px;">
    <form method="post">
      {% csrf_token %}
      <div class="field"><label>Название схемы</label><input name="name" required autofocus placeholder="Мастер · стандарт"></div>
      <div class="grid cols-2" style="gap:12px;">
        <div class="field"><label>Оклад за смену, ₽</label><input name="base_per_day" type="number" step="0.01" value="0"></div>
        <div class="field"><label>Базовый % с выручки</label><input name="base_pct" type="number" step="0.01" value="0"></div>
      </div>
      <div style="display:flex; gap:10px; margin-top:4px;">
        <a class="btn" href="{% url 'payroll_schemes' %}">Отмена</a>
        <button class="btn primary" type="submit" style="flex:1; justify-content:center;">Создать и настроить</button>
      </div>
    </form>
  </div>
{% endblock %}
