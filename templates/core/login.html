{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=3">
</head>
<body>
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
  <div style="width:100%; max-width:340px;">
    <h1 class="display" style="margin-bottom:2px;">Вход</h1>
    <p class="muted" style="margin:0 0 24px;">Кабинет салона</p>

    {% if form.errors %}
      <p style="color:var(--status-noshow); margin-top:0;">Неверный логин или пароль. Попробуйте ещё раз.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="id_username">Логин</label>
        <input type="text" name="username" id="id_username" autofocus>
      </div>
      <div class="field">
        <label for="id_password">Пароль</label>
        <input type="password" name="password" id="id_password">
      </div>
      <button class="btn primary" type="submit" style="width:100%; justify-content:center; padding:11px;">Войти</button>
    </form>
  </div>
</div>
</body>
</html>
